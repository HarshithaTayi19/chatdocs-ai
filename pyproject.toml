[project]
name = "chatdocs-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
